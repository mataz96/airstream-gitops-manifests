apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: petclinic-rollout
  labels:
    app: petclinic
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: 749474900204.dkr.ecr.us-east-1.amazonaws.com/airstream-petclinic
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  strategy:
    blueGreen:
      activeService: active-service
      previewService: preview-service
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30